name: SCADA UV Sensor Log

on:
  repository_dispatch:
    types: [sensor_update]
  workflow_dispatch:
    inputs:
      status:
        description: 'Status (AMAN/PERINGATAN/BAHAYA)'
        required: false
        default: 'PERINGATAN'
      kondisi:
        description: 'Kondisi UV'
        required: false
        default: 'UV Kurang'
      ldr_value:
        description: 'Nilai LDR ADC'
        required: false
        default: '680'
      trigger_telegram:
        description: 'Kirim notifikasi Telegram (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  log-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Simpan Data Telemetri ke CSV
        run: |
          mkdir -p logs

          HEADER="Tanggal_Waktu,Status,Kondisi,Lokasi,Nilai_LDR"
          if [ ! -f logs/sensor_log.csv ] || ! head -1 logs/sensor_log.csv | grep -q "Kondisi"; then
            echo "$HEADER" > logs/sensor_log.csv
          fi

          STATUS="${{ github.event.client_payload.status || github.event.inputs.status || 'AMAN' }}"
          KONDISI="${{ github.event.client_payload.kondisi || github.event.inputs.kondisi || 'UV Cukup' }}"
          LOCATION="${{ github.event.client_payload.location || 'Ruang Sterilisasi UV' }}"
          TIMESTAMP="${{ github.event.client_payload.timestamp || 'Manual Test' }}"
          LDR_VALUE="${{ github.event.client_payload.ldr_value || github.event.inputs.ldr_value || '0' }}"

          echo "${TIMESTAMP},${STATUS},${KONDISI},${LOCATION},${LDR_VALUE}" >> logs/sensor_log.csv

          TOTAL_LOG=$(tail -n +2 logs/sensor_log.csv | wc -l)
          echo "Data telemetri berhasil ditambahkan (Total: ${TOTAL_LOG})"

      - name: Commit dan Push Perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/sensor_log.csv
          git diff --quiet --cached && echo "Tidak ada perubahan data" && exit 0
          git commit -m "Log telemetri SCADA: ${{ github.event.client_payload.kondisi || 'Update' }} [skip ci]"
          git pull --rebase origin main || true
          git push

      - name: Kirim Notifikasi Telegram
        if: ${{ (github.event.client_payload.trigger_telegram == 'true') || (github.event.inputs.trigger_telegram == 'true') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ github.event.client_payload.status || github.event.inputs.status || 'PERINGATAN' }}"
          KONDISI="${{ github.event.client_payload.kondisi || github.event.inputs.kondisi || 'UV Kurang' }}"
          LOCATION="${{ github.event.client_payload.location || 'Ruang Sterilisasi UV' }}"
          TIMESTAMP="${{ github.event.client_payload.timestamp || 'Waktu tidak tersedia' }}"
          LDR_VALUE="${{ github.event.client_payload.ldr_value || github.event.inputs.ldr_value || '0' }}"

          if [ "${STATUS}" = "BAHAYA" ]; then
            HEADER="🚨 BAHAYA - RADIASI UV SANGAT KURANG!"
            ALERT_NOTE="⚠️ Intensitas radiasi UV kritis! Segera periksa sensor dan lampu UV!"
          else
            HEADER="⚠️ PERINGATAN - RADIASI UV KURANG!"
            ALERT_NOTE="⚠️ Intensitas radiasi UV menurun di bawah ambang batas acuan."
          fi

          TEXT=$(printf "%s\n━━━━━━━━━━━━━━━━━━━━\n🛡️ Status: %s\n💡 Kondisi: %s\n📍 Lokasi: %s\n⏰ Waktu: %s\n📈 Nilai ADC LDR: %s\n━━━━━━━━━━━━━━━━━━━━\n%s" \
            "${HEADER}" "${STATUS}" "${KONDISI}" "${LOCATION}" "${TIMESTAMP}" "${LDR_VALUE}" "${ALERT_NOTE}")

          if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TEXT}"
            echo "Notifikasi Telegram berhasil dikirim."
          else
            echo "TELEGRAM_BOT_TOKEN atau TELEGRAM_CHAT_ID belum diatur pada Secrets repository!"
          fi
