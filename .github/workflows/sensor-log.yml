name: SCADA UV Sensor Log

on:
  repository_dispatch:
    types: [sensor_update]
  workflow_dispatch:
    inputs:
      status:
        description: 'Status (AMAN/BAHAYA)'
        required: false
        default: 'AMAN'
      kondisi:
        description: 'Kondisi UV'
        required: false
        default: 'UV Cukup'
      ldr_value:
        description: 'Nilai LDR ADC'
        required: false
        default: '1200'

permissions:
  contents: write

jobs:
  log-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Simpan Data Telemetri ke CSV
        run: |
          mkdir -p logs

          HEADER="Tanggal_Waktu,Status,Kondisi,Lokasi,Nilai_LDR"
          if [ ! -f logs/sensor_log.csv ] || ! head -1 logs/sensor_log.csv | grep -q "Kondisi"; then
            echo "$HEADER" > logs/sensor_log.csv
          fi

          STATUS="${{ github.event.client_payload.status || github.event.inputs.status || 'AMAN' }}"
          KONDISI="${{ github.event.client_payload.kondisi || github.event.inputs.kondisi || 'UV Cukup' }}"
          LOCATION="${{ github.event.client_payload.location || 'Ruang Sterilisasi UV' }}"
          TIMESTAMP="${{ github.event.client_payload.timestamp || 'Manual Test' }}"
          LDR_VALUE="${{ github.event.client_payload.ldr_value || github.event.inputs.ldr_value || '0' }}"

          echo "${TIMESTAMP},${STATUS},${KONDISI},${LOCATION},${LDR_VALUE}" >> logs/sensor_log.csv

          TOTAL_LOG=$(tail -n +2 logs/sensor_log.csv | wc -l)
          echo "Data telemetri berhasil ditambahkan (Total: ${TOTAL_LOG})"

      - name: Commit dan Push Perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/sensor_log.csv
          git diff --quiet --cached && echo "Tidak ada perubahan data" && exit 0
          git commit -m "Log telemetri SCADA: ${{ github.event.client_payload.kondisi || 'Update' }} [skip ci]"
          git push

      - name: Kirim Notifikasi Telegram
        if: github.event.client_payload.trigger_telegram == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ github.event.client_payload.status }}"
          KONDISI="${{ github.event.client_payload.kondisi }}"
          LOCATION="${{ github.event.client_payload.location || 'Ruang Sterilisasi UV' }}"
          TIMESTAMP="${{ github.event.client_payload.timestamp || 'Unknown' }}"
          LDR_VALUE="${{ github.event.client_payload.ldr_value || '0' }}"

          TEXT="🚨 PERINGATAN SCADA: INTENSITAS UV KURANG!%0AStatus: ${STATUS}%0AKondisi: ${KONDISI}%0ALokasi: ${LOCATION}%0AWaktu: ${TIMESTAMP}%0ANilai ADC: ${LDR_VALUE}"

          if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${TEXT}"
          fi
